<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics - Smart Attendance</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        h2 {
            color: #1a2a6c;
            margin-top: 0;
        }

        .nav-pills {
            display: flex;
            gap: 15px;
        }

        .nav-pills a {
            color: #1a2a6c;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 50px;
            background: rgba(26, 42, 108, 0.05);
            transition: all 0.3s ease;
            font-weight: 500;
            border: 1px solid rgba(26, 42, 108, 0.1);
        }

        .nav-pills a:hover,
        .nav-pills a.active {
            background: #1a2a6c;
            color: white;
            transform: translateY(-2px);
        }

        @media (max-width: 900px) {
            .nav-pills {
                flex-wrap: nowrap;
                overflow-x: auto;
                width: 100%;
                justify-content: flex-start;
                padding-bottom: 5px;
            }

            .nav-pills a {
                white-space: nowrap;
                padding: 8px 15px;
                font-size: 0.9em;
            }
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                text-align: center;
                gap: 15px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .card {
                padding: 15px;
            }

            h1 {
                font-size: 1.5em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <div>
                <div class="nav-pills" style="margin-bottom: 20px;">
                    <a href="/">Dashboard</a>
                    <a href="/students">Students</a>
                    <a href="/reports">Reports</a>
                    <a href="/analytics" class="active">Analytics</a>
                </div>
                <h1 style="margin: 10px 0;">📊 Attendance Analytics</h1>
            </div>
            <div id="user-info" style="text-align: right;">
                <img src="{{ session.user.picture }}" style="width: 40px; border-radius: 50%;">
                <div style="font-size: 0.8em; color: #666;">{{ session.user.email }}</div>
            </div>
        </div>

        <div class="grid">
            <div class="card">
                <h2>Daily Attendance Trend</h2>
                <canvas id="dailyChart"></canvas>
            </div>
            <div class="card">
                <h2>Hourly Peak Arrivals</h2>
                <canvas id="hourlyChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        async function loadCharts() {
            const resp = await fetch('/api/stats');
            const data = await resp.json();

            // Daily Chart
            new Chart(document.getElementById('dailyChart'), {
                type: 'line',
                data: {
                    labels: data.daily.map(d => d.date).reverse(),
                    datasets: [{
                        label: 'Present Students',
                        data: data.daily.map(d => d.count).reverse(),
                        borderColor: '#1a2a6c',
                        tension: 0.3,
                        fill: true,
                        backgroundColor: 'rgba(26, 42, 108, 0.1)'
                    }]
                }
            });

            // Hourly Chart
            new Chart(document.getElementById('hourlyChart'), {
                type: 'bar',
                data: {
                    labels: data.hourly.map(d => `${d.hour}:00`),
                    datasets: [{
                        label: 'Check-ins',
                        data: data.hourly.map(d => d.count),
                        backgroundColor: '#b21f1f'
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true, ticks: { stepSize: 1 } } }
                }
            });
        }
        loadCharts();
    </script>
</body>

</html>
